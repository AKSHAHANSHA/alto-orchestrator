[project]
name = "alto-orchestrator"
version = "0.1.0"
description = "Multilingual AI customer-support orchestration platform for Alto Motors"
requires-python = ">=3.11"

dependencies = [
    # ── Core ──────────────────────────────────────────────────────────
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "structlog>=24.4,<26",

    # ── API ───────────────────────────────────────────────────────────
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sse-starlette>=2.1,<3",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9,<3",

    # ── Persistence ───────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "redis>=5.2,<7",

    # ── Orchestration ─────────────────────────────────────────────────
    "langgraph>=0.2.60,<0.4",
    "langgraph-checkpoint-postgres>=2.0.7,<3",
    "psycopg[binary,pool]>=3.2,<4",

    # ── Retrieval ─────────────────────────────────────────────────────
    "qdrant-client>=1.12,<2",
    "fastembed>=0.4,<1",
    "pymupdf>=1.24,<2",

    # ── LLM providers ─────────────────────────────────────────────────
    "openai>=1.57,<3",
    "anthropic>=0.40,<1",

    # ── Language ──────────────────────────────────────────────────────
    "langdetect>=1.0.9,<2",

    # ── Timezones ────────────────────────────────────────────────────
    # Windows ships no IANA zone database, so `zoneinfo.ZoneInfo("Asia/Dubai")`
    # fails at import. tzdata is the pure-python fallback.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-pyyaml>=6.0,<7",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ANN",       # missing annotations
    "TID",       # tidy imports
]
ignore = [
    "ANN401",    # `Any` is legitimate in a few adapter boundaries
    "B008",      # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]           # test signatures carry no useful annotations
"app/db/migrations/*" = ["ANN", "E501"]

# RUF001-003 flag "ambiguous" Unicode — characters that resemble ASCII. In a
# module whose entire purpose is normalising Arabic, and in the tests that
# exercise it, every one of those hits is a false positive on intentional text.
"app/services/understanding/normalizer.py" = ["RUF001", "RUF002", "RUF003"]
"app/services/understanding/engine.py" = ["RUF001", "RUF002", "RUF003"]
"app/services/execution/runtime.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_language.py" = ["ANN", "RUF001", "RUF002", "RUF003"]
"tests/integration/*" = ["ANN", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs, plus the vendor SDKs, which
# are imported lazily inside their adapters so a mock-only deployment need not
# install them at all.
module = [
    "langdetect.*", "fastembed.*", "langgraph.*", "langchain_core.*", "fitz.*",
    "openai.*", "anthropic.*", "qdrant_client.*",
]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires the Docker data plane to be running",
]
